# ==============================================================================
# EzTalk Messenger — Production Nginx Reverse Proxy Configuration
# Усиленная защита: DoS/DDoS mitigation, Slowloris defense, WS Handshake limiter
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Ограничение соединений и частоты запросов (Rate & Connection Limiting Zones)
# ------------------------------------------------------------------------------
# Выделяем зоны разделяемой памяти по 10 МБ (хватает на хранение ~160,000 IP-адресов)

# Ограничение общего количества одновременных TCP-соединений с одного IP-адреса
limit_conn_zone $binary_remote_addr zone=eztalk_conn_limit:10m;

# Ограничение частоты стандартных HTTP API запросов (15 запросов в секунду на IP)
limit_req_zone $binary_remote_addr zone=eztalk_api_limit:10m rate=15r/s;

# Ограничение частоты рукопожатий WebSocket (WebSocket Handshake flood protection: 5 req/s)
limit_req_zone $binary_remote_addr zone=eztalk_ws_limit:10m rate=5r/s;

# Код ответа Nginx при превышении лимитов (429 Too Many Requests вместо 503)
limit_req_status 429;
limit_conn_status 429;

# Upstream для бэкенда Node.js
upstream eztalk_backend {
    server 127.0.0.1:5050;
    keepalive 64; # Пул постоянных keepalive-соединений к Node.js для снижения CPU
}

server {
    listen 80;
    listen [::]:80;
    server_name eztalk.example.com; # Замените на ваш домен или используйте default_server

    # Принудительный редирект всего HTTP трафика на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eztalk.example.com;

    # SSL сертификаты (Let's Encrypt / Cloudflare)
    # ssl_certificate /etc/letsencrypt/live/eztalk.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eztalk.example.com/privkey.pem;

    # Современные стойкие шифры (TLSv1.2, TLSv1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # 2. Защита от Slowloris и медленных атак (Timeouts & Request Buffers)
    # --------------------------------------------------------------------------
    # Агрессивные таймауты не позволяют злоумышленнику удерживать соединения,
    # отправляя заголовки или тело запроса по 1 байту в несколько секунд.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # Лимиты размера тела и буферов (защита оперативной памяти от переполнения)
    client_max_body_size 50m;       # Лимит на загрузку медиафайлов
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # --------------------------------------------------------------------------
    # 3. Базовое ограничение параллельных соединений на уровне сервера
    # --------------------------------------------------------------------------
    # Не более 25 одновременных TCP-соединений с одного IP-адреса
    limit_conn eztalk_conn_limit 25;

    # --------------------------------------------------------------------------
    # 4. Проксирование WebSocket (/socket.io/)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        # Защита от шторма рукопожатий (handshake flood)
        # burst=10 — разрешает начальный всплеск при загрузке вкладок, nodelay — мгновенная обработка без задержки
        limit_req zone=eztalk_ws_limit burst=10 nodelay;

        proxy_pass http://eztalk_backend;
        proxy_http_version 1.1;

        # WebSocket Upgrade заголовки
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Проброс реального IP клиента (важно для Node.js ESS)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключение буферизации для снижения задержки WebSocket сообщений
        proxy_buffering off;

        # Длительные таймауты ожидания сообщений от активного сокета (24 часа)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 5. Проксирование REST API (/api/)
    # --------------------------------------------------------------------------
    location /api/ {
        # Защита от HTTP флуда (burst=20, сглаживание пиков)
        limit_req zone=eztalk_api_limit burst=20 nodelay;

        proxy_pass http://eztalk_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Проброс реального IP клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Заголовки безопасности
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # --------------------------------------------------------------------------
    # 6. Раздача статики фронтенда (SPA / PWA)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/eztalk/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Кэширование ассетов со сгенерированными хешами
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Service Worker и manifest не должны кэшироваться надолго
        location ~* (?:registerSW\.js|sw\.js|manifest\.webmanifest)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
