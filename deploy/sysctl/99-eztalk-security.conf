# ==============================================================================
# EzTalk Messenger — Linux Kernel (sysctl) Security & Performance Hardening
# Защита от TCP SYN-флуда, переполнения очереди соединений и исчерпания сокетов
# Путь установки: /etc/sysctl.d/99-eztalk-security.conf
# Применение изменений: sudo sysctl --system
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Защита от TCP SYN Flood атак (SYN Cookies & Backlog)
# ------------------------------------------------------------------------------
# Включение SYN Cookies. Если очередь входящих SYN-пакетов переполняется (атака),
# ядро не сбрасывает новые подключения, а кодирует состояние соединения в SYN-ACK cookie.
net.ipv4.tcp_syncookies = 1

# Максимальное число полуоткрытых TCP-соединений (SYN_RECV) в очереди.
# При DoS-атаках стандартного значения 128/512 недостаточно.
net.ipv4.tcp_max_syn_backlog = 8192

# Число повторных попыток отправки SYN-ACK на входящий SYN перед сбросом.
# Снижение с 5 до 2 предотвращает удержание ресурсов атакующими с поддельных IP (IP spoofing).
net.ipv4.tcp_synack_retries = 2

# Число повторных попыток исходящего SYN-запроса
net.ipv4.tcp_syn_retries = 2

# ------------------------------------------------------------------------------
# 2. Быстрая утилизация TIME_WAIT и закрытых сокетов (Socket Exhaustion Defense)
# ------------------------------------------------------------------------------
# Время удержания сокета в состоянии FIN-WAIT-2 после отправки FIN (в секундах).
# Сокращение с 60 до 15 сек освобождает системные ресурсы от «зависших» клиентов.
net.ipv4.tcp_fin_timeout = 15

# Разрешить безопасное повторное использование сокетов в состоянии TIME_WAIT
# для новых исходящих TCP-соединений (крайне важно при проксировании Nginx -> Node.js).
net.ipv4.tcp_tw_reuse = 1

# Максимальное количество сокетов в состоянии TIME_WAIT одновременно.
# Защищает от переполнения памяти при миллионах микросоединений.
net.ipv4.tcp_max_tw_buckets = 1440000

# ------------------------------------------------------------------------------
# 3. Очереди соединений уровня ядра (Connection Backlog & Limits)
# ------------------------------------------------------------------------------
# Максимальное количество соединений в очереди ожидания сокета (backlog в listen()).
# Необходимо для обработки пиковых всплесков подключений без сброса TCP RST.
net.core.somaxconn = 65535

# Максимальное количество пакетов в очереди сетевого интерфейса перед передачей стеку IP.
net.core.netdev_max_backlog = 16384

# Расширение диапазона эфемерных портов для исходящих TCP-соединений
net.ipv4.ip_local_port_range = 1024 65535

# ------------------------------------------------------------------------------
# 4. TCP Keepalive (Обнаружение мертвых сокетов)
# ------------------------------------------------------------------------------
# Время ожидания до первой отправки keepalive зонда (в секундах)
net.ipv4.tcp_keepalive_time = 300

# Интервал между повторными зондами keepalive (в секундах)
net.ipv4.tcp_keepalive_intvl = 15

# Количество неотвеченных зондов перед разрывом мертвого соединения
net.ipv4.tcp_keepalive_probes = 5

# ------------------------------------------------------------------------------
# 5. Защита от спуфинга и сетевых аномалий (RFC 1812 Reverse Path Filtering)
# ------------------------------------------------------------------------------
# Строгая проверка маршрута источника (отбрасывание пакетов с поддельным обратным адресом)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Игнорировать широковещательные ICMP echo (защита от Smurf атак)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Отключение приема ICMP redirect (защита от MITM и подмены таблиц маршрутизации)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Отключение IPv4 Source Routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
