<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

  <!-- Primary SEO Meta Tags -->
  <title>EzTalk — Real-time Messenger</title>
  <meta name="title" content="EzTalk — Real-time Messenger" />
  <meta name="description" content="EzTalk — Ultra-fast, secure real-time web messenger with voice calls, group chats, and end-to-end encryption." />
  <meta name="keywords" content="eztalk, messenger, real-time chat, voice calls, encrypted messaging, telegram alternative, web messenger" />
  <meta name="theme-color" content="#09090b" />
  <meta name="color-scheme" content="dark" />

  <!-- App Icons & Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Mobile & PWA Experience -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EzTalk" />
  <meta name="application-name" content="EzTalk" />

  <!-- Open Graph / Facebook / Telegram / WhatsApp (Absolute URLs required) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="EzTalk" />
  <meta property="og:url" content="https://eztalk.app/" />
  <meta property="og:title" content="EzTalk — Real-time Messenger" />
  <meta property="og:description" content="Ultra-fast, secure real-time web messenger with voice calls, group chats, and end-to-end encryption." />
  <meta property="og:image" content="https://eztalk.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X Cards (Absolute URLs required) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://eztalk.app/" />
  <meta name="twitter:title" content="EzTalk — Real-time Messenger" />
  <meta name="twitter:description" content="Ultra-fast, secure real-time web messenger with voice calls, group chats, and end-to-end encryption." />
  <meta name="twitter:image" content="https://eztalk.app/og-image.png" />

  <!-- Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>
